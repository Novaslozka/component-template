image: debian:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - cppcheck
  - build
  - autotest

cppcheck:
  stage: cppcheck
  script:
    - apt-get update
    - apt-get install -y cppcheck
    - cppcheck ./cli
    - cppcheck ./srv
    - cppcheck ./common
build:
  stage: build
  script:
    - apt-get update
    - apt-get install -y make
    - apt-get install -y cmake
    - apt-get install -y gcc
    - apt-get install -y build-essential
    - make all
  artifacts:
    paths:
      - "build/"
autotest:
  stage: autotest
  script:
    - apt-get update
    - apt-get install -y make
    - apt-get install -y cmake
    - apt-get install -y gcc
    - apt-get install -y build-essential
    - mkdir ./autotest/logs
    - make test
  artifacts:
    paths:
      - "./autotest/logs/"