image: nonexistent.vzlu.cz/generic_build:v1

variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
#  - cppcheck
  - build
  - autotest

# cppcheck:
#   stage: cppcheck
#   script:
#     - cppcheck ./cli
#     - cppcheck ./srv
#     - cppcheck ./common
build:
  stage: build
  script:
    - make all
  artifacts:
    paths:
      - "build/"
autotest:
  stage: autotest
  script:
    - mkdir ./autotest/logs
    - make test
  artifacts:
    paths:
      - "./autotest/logs/"